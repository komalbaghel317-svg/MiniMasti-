<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>MiniMasti — Miko</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08131a;color:#eaf3eb;font-family:Georgia,serif;touch-action:none}canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 5px #000}#brand{position:absolute;top:14px;left:17px;letter-spacing:4px;font-weight:bold;color:#d5eadc}#chapter{position:absolute;top:38px;left:18px;font-size:11px;letter-spacing:2px;color:#9ab6a7}#hp{position:absolute;right:18px;top:18px;width:145px;height:12px;border:1px solid #b8d1c1;background:#142226;transform:skewX(-15deg)}#hp i{display:block;height:100%;background:linear-gradient(90deg,#57bda4,#c2edc9);width:100%}#boss{position:absolute;top:56px;left:50%;transform:translateX(-50%);width:min(330px,55vw);text-align:center;opacity:0}#boss b{font-size:11px;letter-spacing:3px;color:#e4d3b3}#boss div{height:8px;border:1px solid #b8a98d;margin-top:6px;background:#241d1d}#boss i{display:block;height:100%;width:100%;background:#c36a62}
#controls{position:fixed;bottom:15px;left:0;right:0;display:flex;justify-content:space-between;padding:0 17px;pointer-events:none}.group{display:flex;gap:9px;align-items:end;pointer-events:auto}.btn{width:56px;height:56px;border-radius:50%;border:1px solid #a7c6b6;background:#10272dcc;color:#eff8ef;font:20px Georgia;touch-action:none}.group.right .btn{font:11px Georgia;letter-spacing:1px;width:53px;height:53px}.btn:active{background:#548c7d}
#cover{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse,#18343bdd,#050c11f5);z-index:4;text-align:center}.panel{padding:28px 24px;max-width:500px;margin:16px;border:1px solid #77998966;background:#102329eF;box-shadow:0 20px 70px #000b}h1{font-size:clamp(36px,9vw,62px);letter-spacing:7px;margin:0;color:#d9efe1}.sub{font-size:11px;letter-spacing:4px;color:#9dbbab;margin:8px 0 20px}.panel p{font-size:14px;line-height:1.6;color:#c5d5ca}#start{padding:13px 24px;background:#c3dfca;border:1px solid #e1f1e4;color:#10201b;font: bold 12px Georgia;letter-spacing:3px}.note{font-size:11px!important;color:#90a99b!important}
</style></head><body><canvas id="c"></canvas>
<div id="hud"><div id="brand">MINIMASTI</div><div id="chapter">CHAPTER I · MYSTIC FOREST</div><div id="hp"><i id="hpfill"></i></div><div id="boss"><b>THE ROOTBOUND GUARDIAN</b><div><i id="bossfill"></i></div></div></div>
<div id="controls"><div class="group"><button class="btn" data-k="left">◀</button><button class="btn" data-k="right">▶</button></div><div class="group right"><button class="btn" data-k="dash">DASH</button><button class="btn" data-k="jump">JUMP</button><button class="btn" data-k="attack">STRIKE</button></div></div>
<div id="cover"><div class="panel"><h1>MINIMASTI</h1><div class="sub">MIKO AND THE MYSTIC FOREST</div><p>A forgotten forest has awakened. Carry the blue flame through the ancient woods and face the Rootbound Guardian.</p><p class="note">Move: A / D or ◀ ▶ · Jump: SPACE · Strike: J · Dash: SHIFT</p><button id="start">ENTER THE FOREST</button></div></div>
<script>
(()=>{const c=document.querySelector('#c'),x=c.getContext('2d'),hp=document.querySelector('#hpfill'),bh=document.querySelector('#boss'),bf=document.querySelector('#bossfill'),cover=document.querySelector('#cover');let W,H,D,t=0,last=0,cam=0,run=false,keys={},dust=[],slashes=[];
const floor=()=>H*.79,world=3400;let p={x:140,y:0,vx:0,vy:0,face:1,health:100,ground:true,attack:0,dash:0,inv:0,anim:0},b={x:2750,h:100,awake:false,attack:0};
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);if(p.y===0)p.y=floor()-65}addEventListener('resize',size);size();
function rnd(a,b){return a+Math.random()*(b-a)}function oval(a,b,rx,ry,col){x.fillStyle=col;x.beginPath();x.ellipse(a,b,rx,ry,0,0,7);x.fill()}function puff(a,b,col,n=7){for(let i=0;i<n;i++)dust.push({x:a,y:b,vx:rnd(-2,2),vy:rnd(-3,1),life:30,r:rnd(1,4),col})}
function back(){let f=floor(),g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#091923');g.addColorStop(.6,'#1b393b');g.addColorStop(1,'#263d34');x.fillStyle=g;x.fillRect(0,0,W,H);oval(W*.78,H*.2,65,65,'#b9d1bc');for(let l=0;l<3;l++){let step=[230,180,145][l],par=[.12,.27,.48][l];for(let wx=-step;wx<world+step;wx+=step){let sx=wx-cam*par;if(sx< -130||sx>W+130)continue;let h=[230,180,125][l]+Math.sin(wx)*30;x.fillStyle=['#10272c','#153137','#1b3936'][l];x.beginPath();x.moveTo(sx-75,f);x.lineTo(sx-35,f-h*.65);x.lineTo(sx-10,f-h);x.lineTo(sx+15,f-h*.7);x.lineTo(sx+55,f-h*.9);x.lineTo(sx+80,f);x.fill()}}x.fillStyle='#172b29';x.fillRect(0,f,W,H-f);x.fillStyle='#456452';x.fillRect(0,f,W,4);for(let wx=0;wx<world;wx+=230){let sx=wx-cam;if(sx< -30||sx>W+30)continue;x.strokeStyle='#548c75';x.lineWidth=3;x.beginPath();x.moveTo(sx,f);x.quadraticCurveTo(sx-8,f-25,sx+10,f-42);x.stroke();oval(sx+10,f-43,8,5,'#86d7b2')}for(let i=0;i<32;i++){let sx=(i*139+t*.2-cam*.1)%(W+30);oval(sx,(i*73+Math.sin(t*.02+i)*18)%(H*.7),1.5,1.5,'#bdebd077')}}
function miko(){let a=p.x-cam+17,y=p.y,step=Math.sin(p.anim*.22)*(Math.abs(p.vx)>.3&&p.ground?5:0);x.save();x.translate(a,y+32);x.scale(p.face,1);oval(0,34,24,5,'#06100dcc');
x.fillStyle='#111e2b';x.beginPath();x.moveTo(-10,-4);x.quadraticCurveTo(-31,12,-22,36);x.quadraticCurveTo(-2,31,12,25);x.lineTo(13,-7);x.closePath();x.fill();
x.strokeStyle='#d8e7df';x.lineWidth=6;x.lineCap='round';x.beginPath();x.moveTo(-5,17);x.lineTo(-8+step,29);x.moveTo(7,17);x.lineTo(10-step,29);x.stroke();x.fillStyle='#17232d';x.fillRect(-17+step,27,14,7);x.fillRect(4-step,27,14,7);
x.fillStyle='#1b2a3a';x.beginPath();x.moveTo(-13,-10);x.quadraticCurveTo(-18,9,-15,26);x.quadraticCurveTo(0,33,16,24);x.lineTo(12,-12);x.closePath();x.fill();
x.strokeStyle='#dbe9e1';x.lineWidth=5;x.beginPath();x.moveTo(-11,-4);x.lineTo(-20,8);x.moveTo(10,-4);x.lineTo(19,6);x.stroke();oval(-20,8,4,4,'#c5dfd3');oval(19,6,4,4,'#c5dfd3');
x.save();let sw=p.attack>0?Math.sin((1-p.attack/18)*Math.PI)*1.2:0;x.translate(19,6);x.rotate(-.7-sw);x.shadowColor='#8ceaff';x.shadowBlur=15;x.strokeStyle='#c4f5ff';x.lineWidth=4;x.beginPath();x.moveTo(0,0);x.lineTo(0,-42);x.stroke();x.shadowBlur=0;x.strokeStyle='#6da9b9';x.lineWidth=3;x.beginPath();x.moveTo(-8,-5);x.lineTo(8,5);x.stroke();x.restore();
x.fillStyle='#101a25';x.beginPath();x.moveTo(-18,-17);x.quadraticCurveTo(-23,-44,0,-46);x.quadraticCurveTo(24,-43,18,-15);x.closePath();x.fill();x.fillStyle='#e6eee5';x.beginPath();x.moveTo(-15,-24);x.quadraticCurveTo(-18,-42,0,-42);x.quadraticCurveTo(17,-42,15,-24);x.lineTo(9,-13);x.lineTo(-10,-13);x.closePath();x.fill();oval(-7,-27,2.5,3,'#203743');oval(7,-27,2.5,3,'#203743');if(p.inv>0&&Math.floor(t/3)%2===0){x.strokeStyle='#a2edff';x.lineWidth=2;x.beginPath();x.arc(0,-7,37,0,7);x.stroke()}x.restore()}
function guardian(){let sx=b.x-cam,y=floor()-120;if(sx< -130||sx>W+130)return;x.save();x.translate(sx,y);x.strokeStyle='#506f50';x.lineWidth=13;x.lineCap='round';for(let i=0;i<5;i++){x.beginPath();x.moveTo((i-2)*18,70);x.quadraticCurveTo((i-2)*34,100,(i-2)*55,125);x.stroke()}x.fillStyle='#2b4338';x.beginPath();x.moveTo(-55,70);x.quadraticCurveTo(-70,-10,-35,-35);x.lineTo(-15,-62);x.lineTo(0,-35);x.lineTo(18,-68);x.lineTo(48,-25);x.quadraticCurveTo(75,25,55,72);x.closePath();x.fill();x.strokeStyle='#8ba477';x.lineWidth=4;x.stroke();x.fillStyle='#9eb68b';x.beginPath();x.moveTo(-38,-35);x.lineTo(-65,-75);x.lineTo(-20,-52);x.fill();x.beginPath();x.moveTo(38,-35);x.lineTo(64,-78);x.lineTo(22,-52);x.fill();x.shadowColor='#e4b878';x.shadowBlur=15;oval(-20,-7,6,4,'#e8c17d');oval(20,-7,6,4,'#e8c17d');x.shadowBlur=0;x.restore()}
function update(dt){t+=dt;p.anim+=dt;let L=keys.left||keys.a||keys.arrowleft,R=keys.right||keys.d||keys.arrowright;if(p.dash>0){p.dash-=dt;p.vx=p.face*10}else{p.vx=((R?1:0)-(L?1:0))*3.5;if(p.vx)p.face=Math.sign(p.vx)}p.x=Math.max(20,Math.min(world-90,p.x+p.vx*dt*.06));if((keys.jump||keys[' '])&&p.ground){p.vy=-12;p.ground=false;puff(p.x,floor()-5,'#a9dcca',5)}p.vy+=.62*dt*.06;p.y+=p.vy*dt*.06;if(p.y+65>=floor()){p.y=floor()-65;p.vy=0;p.ground=true}if(p.attack>0)p.attack-=dt*.06;if(p.inv>0)p.inv-=dt*.06;if(keys.attack&&p.attack<=0){p.attack=18;keys.attack=false;puff(p.x+p.face*40,p.y+25,'#9deeff',8)}if(p.attack>5&&Math.abs(p.x-b.x)<105&&b.h>0){b.h=Math.max(0,b.h-.55*dt*.06);puff(b.x,floor()-100,'#c3d9a3',2)}if(p.x>world-850){b.awake=true;bh.style.opacity=1}if(b.awake&&b.h>0){if(b.attack<=0&&Math.abs(p.x-b.x)<235)b.attack=90;if(b.attack>0){b.attack-=dt*.06;if(b.attack<40&&b.attack>35&&Math.abs(p.x-b.x)<125&&p.inv<=0){p.health=Math.max(0,p.health-14);p.inv=65;puff(p.x,floor()-30,'#d58a76',14)}}}hp.style.width=p.health+'%';bf.style.width=b.h+'%';if(p.health<=0||b.h<=0){run=false;cover.style.display='grid';cover.querySelector('h1').textContent=b.h<=0?'VICTORY':'TRY AGAIN';cover.querySelector('.sub').textContent=b.h<=0?'THE MYSTIC FOREST IS SAFE':'THE FOREST IS STILL WAITING';cover.querySelector('.panel p').textContent=b.h<=0?'The blue flame shines once more. Chapter I complete.':'Miko can rise again. Return to the forest and face the Guardian.';document.querySelector('#start').textContent='PLAY AGAIN'}cam=Math.max(0,Math.min(world-W,p.x-W*.35));dust.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.08;q.life-=dt*.06});dust=dust.filter(q=>q.life>0)}
function draw(){back();guardian();miko();dust.forEach(q=>{x.globalAlpha=q.life/30;oval(q.x-cam,q.y,q.r,q.r,q.col);x.globalAlpha=1})}
function loop(ts){let dt=Math.min(32,ts-last||16);last=ts;if(run)update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
document.querySelector('#start').onclick=()=>{p.x=140;p.y=floor()-65;p.vy=0;p.health=100;p.inv=0;b.h=100;b.awake=false;b.attack=0;bh.style.opacity=0;cover.style.display='none';run=true};
addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys[k]=true;if([' ','arrowleft','arrowright'].includes(k))e.preventDefault();if(k==='j')keys.attack=true;if(k==='shift')p.dash=12});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('.btn').forEach(el=>{let k=el.dataset.k;el.onpointerdown=e=>{e.preventDefault();if(k==='attack')keys.attack=true;else if(k==='dash')p.dash=12;else keys[k]=true};el.onpointerup=el.onpointercancel=el.onpointerleave=e=>{e.preventDefault();if(k!=='attack'&&k!=='dash')keys[k]=false}});
})();
</script></body></html>

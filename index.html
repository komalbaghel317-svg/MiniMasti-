<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniMasti - Miko</title>
<style>
body {
  margin: 0;
  background: #101b24;
  color: white;
  font-family: Arial;
  text-align: center;
}
h1 { color: #9effd0; }
canvas {
  width: 100%;
  height: 65vh;
  background: linear-gradient(#142c3c, #263d37);
}
</style>
</head>
<body>
<h1>MINIMASTI</h1>
<p>Chapter 1 - Mystic Forest</p>
<canvas id="game"></canvas>
<h2>Hero: MIKO</h2>
<p>Your adventure begins...</p>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight * 0.65;
}
resize();
addEventListener("resize", resize);

let x = 150;
let y = 250;

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Miko's cloak
  ctx.fillStyle = "#17283b";
  ctx.beginPath();
  ctx.ellipse(x, y+15, 27, 40, 0, 0, Math.PI*2);
  ctx.fill();

  // Mask
  ctx.fillStyle = "#e9f2ed";
  ctx.beginPath();
  ctx.ellipse(x, y-30, 20, 23, 0, 0, Math.PI*2);
  ctx.fill();

  // Eyes
  ctx.fillStyle = "#263b50";
  ctx.fillRect(x-12, y-34, 7, 5);
  ctx.fillRect(x+5, y-34, 7, 5);

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
